<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CT Live Board</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<meta name="theme-color" content="#002a52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CT Board">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root { --navy:#002a52; --navy2:#0c3d6e; --red:#c8102e; --ink:#0f1d2e; --mut:#5b6b7e; --line:#dbe3ec; --bg:#e9eef5; --green:#16a34a; --amber:#f59e0b; }
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; background: var(--bg); color: var(--ink); min-height: 100dvh; }
a { color: inherit; }
header { position: sticky; top: 0; z-index: 10; background: linear-gradient(125deg, #002a52 0%, #001830 75%); color: #fff; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 12px; border-bottom: 4px solid var(--red); }
header .jet { width: 42px; height: 36px; fill: rgba(255,255,255,.93); flex: none; }
header h1 { font-size: 20px; font-weight: 800; line-height: 1.05; }
header .sub { font-size: 12px; color: #a9c4e2; margin-top: 2px; display: flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #4ade80; display: inline-block; }
.dot.off { background: #f87171; }
header .clock { margin-left: auto; font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
.sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 12px 0; }
.sum div { background: #fff; border-radius: 12px; padding: 8px 10px; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--mut); text-transform: uppercase; box-shadow: 0 1px 3px rgba(0,30,60,.1); }
.sum b { display: block; font-size: 30px; color: var(--navy); line-height: 1.05; }
.sum .lt b { color: var(--red); }
.tabs { display: flex; gap: 8px; padding: 12px 12px 0; }
.tabs button { flex: 1; border: 0; background: #fff; border-radius: 12px; padding: 12px 6px; font: inherit; font-weight: 800; font-size: 14px; color: var(--navy); box-shadow: 0 1px 3px rgba(0,30,60,.12); }
.tabs button.on { background: var(--navy); color: #fff; }
.tabs button i { font-style: normal; opacity: .75; margin-left: 4px; }
main { padding: 12px 12px calc(30px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
.none { text-align: center; color: var(--mut); padding: 40px 10px; font-size: 16px; }
.card { background: #fff; border-radius: 14px; box-shadow: 0 1px 4px rgba(0,30,60,.12); border-left: 8px solid #94a3b8; padding: 12px 14px; }
.card.g { border-left-color: var(--green); } .card.a { border-left-color: var(--amber); } .card.r { border-left-color: var(--red); background: #fff7f7; }
.card.tr { border-left-color: #0ea5e9; background: #f0f9ff; }
.top { display: flex; align-items: baseline; gap: 10px; }
.rt { font-size: 24px; font-weight: 800; color: var(--navy); }
.cd { margin-left: auto; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.card.r .cd { color: var(--red); } .card.a .cd { color: #b45309; } .card.g .cd { color: #15803d; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; font-size: 15px; }
.facts span b { color: var(--mut); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; margin-right: 5px; }
.tag { display: inline-block; font-size: 11px; font-weight: 800; border-radius: 6px; padding: 2px 7px; vertical-align: middle; }
.tag.type { background: #dbeafe; color: #1e3a8a; } .tag.aos { background: var(--red); color: #fff; }
.tag.late { background: #fee2e2; color: #b91c1c; } .tag.early { background: #dcfce7; color: #166534; }
.tag.tr { background: #bae6fd; color: #0369a1; } .tag.test { background: #facc15; color: #713f12; }
.old { text-decoration: line-through; color: var(--mut); margin-right: 6px; }
.note { margin-top: 6px; font-size: 14px; color: var(--mut); overflow-wrap: anywhere; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.btns > * { border: 1.5px solid #bfd0e4; background: #fff; border-radius: 10px; padding: 12px 6px; font: inherit; font-weight: 700; font-size: 15px; color: var(--navy); text-align: center; text-decoration: none; }
.btns .go { background: var(--green); border-color: var(--green); color: #fff; }
.btns .en { border-color: #7dd3fc; color: #0369a1; }
.btns .en.on { background: #0ea5e9; border-color: #0ea5e9; color: #fff; }
.foot { text-align: center; padding: 6px 0 0; }
.foot a { color: var(--navy2); font-size: 14px; font-weight: 700; text-decoration: none; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px 14px; display: inline-block; }
.toast { position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); background: #0f1d2e; color: #fff; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; font-size: 15px; z-index: 30; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
.toast button { margin-left: auto; border: 0; background: transparent; color: #7dd3fc; font: inherit; font-weight: 800; padding: 4px 8px; }
.toast[hidden], .sheet[hidden] { display: none; }
.sheet { position: fixed; inset: 0; background: rgba(0,20,40,.55); z-index: 40; display: flex; align-items: flex-end; }
.sheet form { background: #fff; width: 100%; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 92dvh; overflow: auto; }
.sheet h2 { font-size: 18px; color: var(--navy); margin-bottom: 12px; }
.sheet label { display: block; font-size: 12px; font-weight: 800; letter-spacing: .06em; color: var(--mut); text-transform: uppercase; margin: 10px 0 4px; }
.sheet input { width: 100%; font: inherit; font-size: 17px; padding: 11px 12px; border: 1.5px solid #bfd0e4; border-radius: 10px; }
.sheet .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sheet .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.sheet .acts button { border: 0; border-radius: 10px; padding: 14px; font: inherit; font-weight: 800; font-size: 16px; background: #e2e8f0; color: var(--navy); }
.sheet .acts .save { background: var(--navy); color: #fff; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="jet" viewBox="0 0 120 100">
<path d="M6,50 Q6,45 20,44.5 L100,46 Q118,48 118,50 Q118,52 100,54 L20,55.5 Q6,55 6,50 Z"/>
<path d="M54,46.5 L34,8 L46,8 L82,46 Z"/><path d="M54,53.5 L34,92 L46,92 L82,54 Z"/>
<path d="M18,45.5 L8,27 L16,27 L32,45.5 Z"/><path d="M18,54.5 L8,73 L16,73 L32,54.5 Z"/>
</symbol>
</defs></svg>
<header>
<svg class="jet"><use href="#jet"/></svg>
<div><h1>CT Live Board</h1><div class="sub"><span class="dot off" id="dot"></span><span id="state">Connecting...</span></div></div>
<div class="clock" id="clock">--:--</div>
</header>
<div class="sum" id="sum"></div>
<div class="tabs" id="tabs"></div>
<main id="list"></main>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="toastBtn">Undo</button></div>
<div class="sheet" id="sheet" hidden>
<form id="form">
<h2 id="sheetTitle">Edit</h2>
<div class="row"><div><label for="f-flt">Flight</label><input id="f-flt" autocomplete="off" autocapitalize="characters"></div><div><label for="f-time">Time (24h, like 1830)</label><input id="f-time" inputmode="numeric" maxlength="5" autocomplete="off"></div></div>
<div class="row"><div><label for="f-gate">Gate</label><input id="f-gate" autocomplete="off" autocapitalize="characters"></div><div><label for="f-tail">Tail #</label><input id="f-tail" autocomplete="off" autocapitalize="characters"></div></div>
<label for="f-awb">AWB</label><input id="f-awb" autocomplete="off">
<label for="f-comments">Comments</label><input id="f-comments" autocomplete="off">
<div class="acts"><button type="button" id="cancel">Cancel</button><button type="submit" class="save">Save</button></div>
</form>
</div>
<script>
'use strict';
const DEFAULT_BOARD = 'https://atl-dept593-board.onrender.com';
const qs = new URLSearchParams(location.search);
const BOARD = /^http:\/\/localhost(:\d+)?$/.test(qs.get('board') || '') ? qs.get('board') : DEFAULT_BOARD;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let jobs = [], wsOk = false, tab = null, editId = null;
try { const c = JSON.parse(localStorage.getItem('ctapp-jobs') || 'null'); if (Array.isArray(c)) jobs = c; } catch (e) {}
const etFmt = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' });
function etParts(d) { const p = {}; etFmt.formatToParts(d).forEach(x => { p[x.type] = x.value; }); return { y: +p.year, mo: +p.month, d: +p.day, h: (+p.hour) % 24, mi: +p.minute }; }
function etWall(y, mo, d, h, mi) { const want = Date.UTC(y, mo - 1, d, h, mi); let g = want; for (let i = 0; i < 3; i++) { const p = etParts(new Date(g)); g += want - Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi); } return g; }
const t4 = t => { const s = String(t == null ? '' : t).replace(':', '').trim(); return s ? s.padStart(4, '0') : ''; };
function jobTarget(j) {
const s = t4(j.time); if (!/^\d{4}$/.test(s)) return null;
const h = +s.slice(0, 2), m = +s.slice(2, 4); if (h > 23 || m > 59) return null;
const base = (j.addedAtISO ? new Date(j.addedAtISO).getTime() : Date.now()) - 3 * 3600000;
const p = etParts(new Date(base)); let t = etWall(p.y, p.mo, p.d, h, m);
if (t < base) { const nd = new Date(Date.UTC(p.y, p.mo - 1, p.d) + 86400000); t = etWall(nd.getUTCFullYear(), nd.getUTCMonth() + 1, nd.getUTCDate(), h, m); }
return t;
}
const dur = m => { const a = Math.round(Math.abs(m)); return a >= 60 ? Math.floor(a / 60) + 'h ' + (a % 60) + 'm' : a + 'm'; };
const fmtT = t => { const s = t4(t); return s ? s.slice(0, 2) + ':' + s.slice(2) : '--'; };
const isOut = j => String(j.route || '').toUpperCase().startsWith('ATL');
function shift(j) {
if (!j.origTime || !j.time) return 0;
const mm = t => { const s = t4(t); return +s.slice(0, 2) * 60 + +s.slice(2); };
let d = mm(j.time) - mm(j.origTime); if (d > 720) d -= 1440; if (d < -720) d += 1440; return d;
}
function flightUrl(j) {
const m = String(j.flt || '').match(/(\d{1,4})\s*$/); if (!m) return '';
const p = etParts(new Date(jobTarget(j) || Date.now()));
return 'https://www.delta.com/flightstatus/1/' + parseInt(m[1], 10) + '/' + p.y + '-' + String(p.mo).padStart(2, '0') + '-' + String(p.d).padStart(2, '0');
}
function card(r) {
const j = r.j, out = isOut(j), m = r.t == null ? null : (r.t - Date.now()) / 60000;
const c = j.transit ? 'tr' : m == null ? '' : m < 45 ? 'r' : m < 90 ? 'a' : 'g';
const cd = j.transit ? '<span class="tag tr">&#9992; IN TRANSIT</span>' : m == null ? '' : m < 0 ? 'LATE ' + dur(m) : dur(m);
const d = shift(j);
const delay = d === 0 ? '' : (j.origTime ? '<span class="old">' + fmtT(j.origTime) + '</span>' : '') + `<span class="tag ${d > 0 ? 'late' : 'early'}">${d > 0 ? 'DELAYED +' : 'EARLIER -'}${dur(d)}</span>`;
const label = out ? 'ETD' : 'ETA', done = out ? 'Loaded' : 'Received', url = flightUrl(j);
const typ = j.type ? `<span class="tag ${/AOS/i.test(j.type) ? 'aos' : 'type'}">${esc(j.type)}</span>` : '';
const f = [];
if (j.flt) f.push(`<span><b>Flight</b>${esc(j.flt)}</span>`);
f.push(`<span><b>${label}</b>${esc(fmtT(j.time))} ${delay}</span>`);
if (j.gate) f.push(`<span><b>Gate</b>${esc(j.gate)}</span>`);
if (j.ac) f.push(`<span><b>A/C</b>${esc(j.ac)}</span>`);
if (j.tail) f.push(`<span><b>Tail</b>${esc(j.tail)}</span>`);
if (j.awb) f.push(`<span><b>AWB</b>${esc(j.awb)}</span>`);
return `<div class="card ${c}"><div class="top"><span class="rt">${esc(String(j.route || '').replace('-', ' → '))}</span>${j.isTest ? '<span class="tag test">TEST</span>' : ''}${typ}<span class="cd">${cd}</span></div>
<div class="facts">${f.join('')}</div>${j.comments ? `<div class="note">${esc(j.comments)}</div>` : ''}
<div class="btns">${url ? `<a href="${url}" target="_blank" rel="noopener">&#8599; Flight info</a>` : '<span style="opacity:.4">No flight #</span>'}
<button class="en ${j.transit ? 'on' : ''}" data-a="transit" data-id="${j.id}">&#9992; ${j.transit ? 'En route (undo)' : 'En route'}</button>
<button data-a="edit" data-id="${j.id}">&#9998; Edit</button>
<button class="go" data-a="done" data-id="${j.id}" data-l="${done}">&check; ${done}</button></div></div>`;
}
function render() {
$('#dot').classList.toggle('off', !wsOk);
$('#state').textContent = wsOk ? 'Live' : 'Reconnecting...';
const rows = jobs.filter(j => !j.done).map(j => ({ j, t: jobTarget(j) })).sort((a, b) => (a.t == null) - (b.t == null) || a.t - b.t);
const late = rows.filter(r => r.t != null && r.t < Date.now() && !r.j.transit).length;
const soon = rows.filter(r => r.t != null && r.t >= Date.now() && r.t - Date.now() < 45 * 60000 && !r.j.transit).length;
const out = rows.filter(r => isOut(r.j)), inn = rows.filter(r => !isOut(r.j));
if (tab == null || (tab === 'out' && !out.length && inn.length) || (tab === 'in' && !inn.length && out.length)) tab = out.length || !inn.length ? 'out' : 'in';
$('#sum').innerHTML = `<div><b>${rows.length}</b>Open</div><div class="lt"><b>${late}</b>Late</div><div><b>${soon}</b>Under 45 min</div>`;
$('#tabs').innerHTML = `<button class="${tab === 'out' ? 'on' : ''}" data-tab="out">Take to the plane<i>${out.length}</i></button><button class="${tab === 'in' ? 'on' : ''}" data-tab="in">Go pick up<i>${inn.length}</i></button>`;
const list = tab === 'out' ? out : inn;
$('#list').innerHTML = (list.length ? list.map(card).join('') : '<div class="none">Nothing on the board right now.</div>') + `<div class="foot"><a href="${BOARD}" target="_blank" rel="noopener">Open the full Live Board &#8599;</a></div>`;
}
let tT = 0;
function toast(msg, undoFn) {
$('#toastMsg').textContent = msg; const b = $('#toastBtn');
b.style.display = undoFn ? '' : 'none'; b.onclick = () => { $('#toast').hidden = true; undoFn && undoFn(); };
$('#toast').hidden = false; clearTimeout(tT); tT = setTimeout(() => { $('#toast').hidden = true; }, undoFn ? 8000 : 3500);
}
async function api(method, path, body) {
try {
const r = await fetch(BOARD + path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
if (!r.ok) throw new Error(r.status);
return await r.json();
} catch (e) { toast('Could not reach the board. Try again.'); return null; }
}
document.addEventListener('click', async e => {
const t = e.target.closest('[data-tab],[data-a]'); if (!t) return;
if (t.dataset.tab) { tab = t.dataset.tab; render(); return; }
const id = +t.dataset.id, a = t.dataset.a;
if (a === 'transit') { await api('POST', '/api/jobs/' + id + '/transit'); }
else if (a === 'done') { const r = await api('POST', '/api/jobs/' + id + '/done', { label: t.dataset.l }); if (r) toast('Marked ' + t.dataset.l, () => api('POST', '/api/jobs/' + id + '/undo')); }
else if (a === 'edit') openEdit(id);
});
function openEdit(id) {
const j = jobs.find(x => x.id === id); if (!j) return; editId = id;
$('#sheetTitle').textContent = 'Edit ' + String(j.route || '').replace('-', ' → ');
[['flt', 'flt'], ['time', 'time'], ['gate', 'gate'], ['tail', 'tail'], ['awb', 'awb'], ['comments', 'comments']].forEach(([k, f]) => { $('#f-' + k).value = j[f] || ''; });
$('#sheet').hidden = false;
}
$('#cancel').onclick = () => { $('#sheet').hidden = true; };
$('#form').onsubmit = async e => {
e.preventDefault();
const b = {}; ['flt', 'time', 'gate', 'tail', 'awb', 'comments'].forEach(k => { b[k] = $('#f-' + k).value.trim(); });
b.time = b.time.replace(':', '');
if (b.time && !/^\d{3,4}$/.test(b.time)) { toast('Time should look like 1830'); return; }
$('#sheet').hidden = true;
if (await api('PUT', '/api/jobs/' + editId, b)) toast('Saved');
};
function connectWS() {
let ws;
try { ws = new WebSocket(BOARD.replace(/^http/, 'ws') + '/live'); } catch (e) { setTimeout(connectWS, 5000); return; }
ws.onopen = () => { wsOk = true; render(); };
ws.onmessage = ev => { try { const m = JSON.parse(ev.data); if (m.type === 'init' || m.type === 'jobs') { jobs = m.jobs || []; try { localStorage.setItem('ctapp-jobs', JSON.stringify(jobs)); } catch (x) {} if ($('#sheet').hidden) render(); } } catch (x) {} };
ws.onclose = () => { wsOk = false; render(); setTimeout(connectWS, 4000); };
ws.onerror = () => ws.close();
}
function clock() { const p = etParts(new Date()); $('#clock').textContent = String(p.h).padStart(2, '0') + ':' + String(p.mi).padStart(2, '0'); }
clock(); render(); connectWS();
setInterval(clock, 10000); setInterval(() => { if ($('#sheet').hidden) render(); }, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
</script>
</body>
</html>
