<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CT Wall</title>
<meta name="theme-color" content="#050e1a">
<style>
  :root { --bg:#050e1a; --card:#0b1a2c; --line:#17304d; --ink:#eef5fc; --mut:#86a3c2; --red:#ef4444; --green:#22c55e; --amber:#f59e0b; --blue:#38bdf8; --navy:#0d4a8a; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; background: var(--bg); color: var(--ink); }
  .wrap { height: 100vh; display: grid; grid-template-columns: 61fr 39fr; gap: .8vw; padding: 0; }

  /* left: the live board, exactly as it looks on the TV view */
  #bframe { position: relative; overflow: hidden; background: #06111f; }
  #bf { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; pointer-events: none; background: #06111f; }

  /* right: one simple screen at a time */
  .side { position: relative; padding: 1.4vh .9vw 1.4vh 0; display: flex; flex-direction: column; min-width: 0; }
  .stage { position: relative; flex: 1; min-height: 0; }
  .scr { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 1.2vw; padding: 2.4vh 1.6vw; opacity: 0; transform: translateY(1.5vh); visibility: hidden; transition: opacity .7s, transform .7s, visibility .7s; overflow: hidden; }
  .scr.on { opacity: 1; transform: none; visibility: visible; }
  .scr::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: .5vw; background: var(--c); }
  .scr.ct { --c: #ef4444; } .scr.atl { --c: #38bdf8; } .scr.all { --c: #22c55e; }
  .top { display: flex; align-items: center; gap: 1vw; flex: none; margin-bottom: 2vh; }
  .tag { padding: .5vh 1.1vw; border-radius: 999px; font-size: 2.2vh; font-weight: 800; letter-spacing: .14em; color: #fff; background: var(--c); }
  .ttl { font-size: 4vh; font-weight: 800; letter-spacing: .02em; line-height: 1.1; }
    .stale { color: var(--amber); font-weight: 700; }
  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 2.6vh; justify-content: space-evenly; }
  .foot { flex: none; margin-top: 1.2vh; font-size: 1.9vh; color: var(--mut); text-align: right; }

  /* big number */
  .hero { display: flex; flex-direction: column; gap: .8vh; }
  .hero .l { font-size: 2.6vh; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); }
  .hero .v { font-size: 19vh; font-weight: 800; line-height: .95; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .hero .v.m { font-size: 15vh; }
  .chip { align-self: flex-start; display: inline-flex; align-items: center; gap: .6vw; margin-top: 1.2vh; padding: .8vh 1.3vw; border-radius: 999px; font-size: 3.2vh; font-weight: 800; }
  .chip.good { background: rgba(34,197,94,.18); color: #6ee7a0; } .chip.bad { background: rgba(239,68,68,.2); color: #ff8a8a; } .chip.flat { background: rgba(134,163,194,.15); color: var(--mut); }
  .tiles { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 1vw; }
  .tile { background: #0f2238; border: 1px solid var(--line); border-radius: 1vw; padding: 1.8vh 1vw; min-width: 0; }
  .tiles[style*="--n:3"] .tile .v { font-size: 4.2vh; }
  .tile .v { white-space: nowrap; font-size: 6vh; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .tiles[style*="--n:2"] .tile .v { font-size: 7vh; }
  .tile .l { margin-top: 1vh; font-size: 2.1vh; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mut); }
  .tile .s { margin-top: .5vh; font-size: 2.1vh; color: #b5cbe2; }
  .tile.red .v { color: #ff7b7b; } .tile.amber .v { color: #fbbf24; } .tile.green .v { color: #5eea96; }

  /* bars */
  .bars { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; gap: 1vh; }
  .bar .r1 { display: flex; align-items: baseline; justify-content: space-between; gap: 1vw; margin-bottom: .8vh; }
  .bar .n { font-size: 3.9vh; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .x { font-size: 4.2vh; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar .x small { margin-left: .6vw; font-size: 2.2vh; font-weight: 600; color: var(--mut); }
  .bar .t { height: 3vh; background: #12263d; border-radius: 99px; overflow: hidden; }
  .bar .t b { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #1d6fc4, #38bdf8); width: 0; transition: width 1.1s cubic-bezier(.2,.7,.2,1); }
  .scr.on .bar .t b { width: var(--w); }
  .bar.g .t b { background: linear-gradient(90deg, #15803d, #4ade80); } .bar.y .t b { background: linear-gradient(90deg, #ca8a04, #facc15); }
  .bar.o .t b { background: linear-gradient(90deg, #c2410c, #fb923c); } .bar.r .t b { background: linear-gradient(90deg, #b91c1c, #f87171); }

  /* table */
  .rows { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; gap: 1vh; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 1vw; background: #0f2238; border: 1px solid var(--line); border-radius: 1vw; padding: 2.6vh 1.4vw; }
  .row .a { font-size: 4vh; font-weight: 800; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .a small { display: block; margin-top: .3vh; font-size: 2vh; font-weight: 500; color: var(--mut); overflow: hidden; text-overflow: ellipsis; }
  .row .b { font-size: 4.2vh; font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .row .b.red { color: #ff7b7b; } .row .b.amber { color: #fbbf24; }
  .note { font-size: 2.8vh; color: var(--mut); line-height: 1.35; }

  /* gauge */
  .gauge { display: flex; align-items: center; gap: 2vw; }
  .gauge svg { width: 30vh; height: 30vh; flex: none; }
  .gauge .gv { font-size: 31px; font-weight: 800; fill: #fff; }
  .gtxt { display: flex; flex-direction: column; gap: 1.2vh; }

  /* chart */
  .chartbox { flex: 1; min-height: 0; display: flex; align-items: center; }
  .chartbox svg { width: 100%; height: 100%; }

  /* plain words */
  .says { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; gap: 2.2vh; }
  .say { background: #0f2238; border: 1px solid var(--line); border-radius: 1vw; padding: 2vh 1.4vw; }
  .say b { display: block; font-size: 2.2vh; letter-spacing: .1em; text-transform: uppercase; color: var(--blue); margin-bottom: .7vh; }
  .say span { font-size: 3vh; line-height: 1.3; font-weight: 500; }
  .empty { margin: auto; font-size: 3vh; color: var(--mut); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div id="bframe"><iframe id="bf" title="Live Board" scrolling="no"></iframe></div>
  <div class="side"><div class="stage" id="stage"><div class="empty">Loading the numbers…</div></div></div>
</div>

<script>
'use strict';
const DEFAULT_BOARD = 'https://atl-dept593-board.onrender.com';
const qs = new URLSearchParams(location.search);
const BOARD = /^http:\/\/localhost(:\d+)?$/.test(qs.get('board') || '') ? qs.get('board') : DEFAULT_BOARD;
const ROTATE_SEC = Math.max(8, parseInt(qs.get('sec') || '40', 10));
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = n => Number(n || 0).toLocaleString('en-US');
const money = n => { n = Number(n || 0); const a = Math.abs(n);
  return a >= 1e6 ? '$' + (n / 1e6).toFixed(a >= 1e7 ? 1 : 2).replace(/\.?0+$/, '') + 'M' : a >= 1e3 ? '$' + Math.round(n / 1e3).toLocaleString('en-US') + 'K' : '$' + Math.round(n); };
const moneyFull = n => '$' + Math.round(Number(n || 0)).toLocaleString('en-US');
const pct = n => Math.round(Number(n || 0) * 100) + '%';
const title = s => String(s || '').toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase()).replace(/\bAos\b/, 'AOS').replace(/\bRon\b/, 'RON').replace(/\bRad\b/, 'RAD').replace(/\bAtl\b/, 'ATL');
const holder = n => { n = String(n || '').replace(/^\d+\w*\s+/, '') || String(n || ''); return /^\(?blank\)?$/i.test(n) ? 'Unassigned' : n; };
const cut = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };

let D = null, cur = 0, screens = [], timer = null;

// ── building blocks ──────────────────────────────────────────────────────────
const hero = (label, val, chip, cls, big) => `<div class="hero"><div class="l">${esc(label)}</div><div class="v${big ? ' m' : ''}">${val}</div>${chip ? `<div class="chip ${cls || 'flat'}">${chip}</div>` : ''}</div>`;
const tiles = list => `<div class="tiles" style="--n:${list.length}">${list.map(t => `<div class="tile ${t.c || ''}"><div class="v">${t.v}</div><div class="l">${esc(t.l)}</div>${t.s ? `<div class="s">${esc(t.s)}</div>` : ''}</div>`).join('')}</div>`;
const bars = rows => {
  const max = Math.max(1, ...rows.map(r => r.v));
  return `<div class="bars">` + rows.map(r => `<div class="bar ${r.c || ''}"><div class="r1"><div class="n">${esc(r.n)}</div><div class="x">${r.label != null ? r.label : num(r.v)}${r.small ? `<small>${esc(r.small)}</small>` : ''}</div></div><div class="t"><b style="--w:${Math.max(3, r.v / max * 100).toFixed(1)}%"></b></div></div>`).join('') + `</div>`;
};
const rowsList = list => `<div class="rows">` + list.map(r => `<div class="row"><div class="a">${esc(r.a)}${r.sub ? `<small>${esc(r.sub)}</small>` : ''}</div><div class="b ${r.c || ''}">${esc(r.b)}</div></div>`).join('') + `</div>`;
const says = list => `<div class="says">` + list.map(l => `<div class="say"><b>${esc(l.label)}</b><span>${esc(l.text)}</span></div>`).join('') + `</div>`;
const chg = (n, fmt, goodWhenDown) => n === 0 ? ['no change', 'flat'] : [(n < 0 ? '▼ ' : '▲ ') + fmt(Math.abs(n)) + ' since last update', (n < 0) === !!goodWhenDown ? 'good' : 'bad'];

function gauge(p) {
  const r = 52, c = 2 * Math.PI * r, v = Math.max(0, Math.min(1, p));
  return `<svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="${r}" fill="none" stroke="#12263d" stroke-width="14"/><circle cx="70" cy="70" r="${r}" fill="none" stroke="#22c55e" stroke-width="14" stroke-linecap="round" stroke-dasharray="${(c * v).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 70 70)"/><text x="70" y="70" text-anchor="middle" dominant-baseline="central" class="gv">${Math.round(v * 100)}%</text></svg>`;
}

// one clean line chart; the vertical scale is fixed or rounded to nice numbers so labels never run past what makes sense
function chart(points, key, color, fmt, fixed, dims) {
  if (!points || points.length < 2) return '<div class="empty">Not enough history yet</div>';
  const W = 800, H = dims ? dims[1] : 900, pad = { l: 140, r: 36, t: 30, b: 64 };
  const vals = points.map(p => p[key]);
  let lo, hi;
  if (fixed) { lo = fixed[0]; hi = fixed[1]; }
  else { lo = 0; hi = Math.max(...vals); const st = Math.pow(10, Math.floor(Math.log10(hi || 1))); hi = Math.ceil(hi / (st / 2)) * (st / 2); }
  const X = i => pad.l + i * (W - pad.l - pad.r) / (points.length - 1);
  const Y = v => pad.t + (hi - v) * (H - pad.t - pad.b) / (hi - lo);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4, y = Y(v); g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y}" y2="${y}" stroke="#1a3452"/><text x="${pad.l - 16}" y="${y + 11}" text-anchor="end" font-size="36" fill="#9bb7d4">${fmt(v)}</text>`; }
  const path = points.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(p[key]).toFixed(1)).join(' ');
  const md = d => { const p = d.split('-'); return +p[1] + '/' + +p[2]; };
  const last = points.length - 1, mid = Math.floor(last / 2);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}
    <path d="${path} L${X(last)},${H - pad.b} L${X(0)},${H - pad.b} Z" fill="${color}" opacity=".16"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(last)}" cy="${Y(vals[last])}" r="13" fill="${color}" stroke="#0b1a2c" stroke-width="4"/>
    <text x="${X(0)}" y="${H - 14}" font-size="32" fill="#9bb7d4" text-anchor="start">${md(points[0].d)}</text>
    <text x="${X(mid)}" y="${H - 14}" font-size="32" fill="#9bb7d4" text-anchor="middle">${md(points[mid].d)}</text>
    <text x="${X(last)}" y="${H - 14}" font-size="32" fill="#9bb7d4" text-anchor="end">${md(points[last].d)}</text></svg>`;
}
const bandCls = n => /MONITOR/.test(n) ? 'g' : /CONTACT/.test(n) ? 'y' : /FOLLOW/.test(n) ? 'o' : /CRITICAL|UNACCEPT/.test(n) ? 'r' : '';
const ageCls = n => /OVER/.test(n) ? 'r' : /91/.test(n) ? 'o' : /31/.test(n) ? 'y' : /CLOCK/.test(n) ? '' : 'g';

// ── the screens (one idea each, big enough to read from across the room) ─────
function buildScreens() {
  const ct = D.ct || {}, atl = D.atl || {}, all = D.all || {}, tr = D.trend || [], f = tr[0] || {};
  const L = all.lines || [], hd = all.headline || [], oc = ct.outreach || {}, sb = ct.sinceBaseline || {};
  const S = [];
  const add = (tag, t, h) => S.push({ tag, t, h });

  // CENTRAL TOOLING
  { const [c1, k1] = chg(ct.deltaOut || 0, num, true);
    add('ct', 'Tools out at other stations', hero('Tools out right now', num(ct.out), c1, k1) + tiles([{ v: money(ct.value), l: 'Value out', c: 'red' }, { v: num(ct.crit), l: 'Out 30+ days', s: money(ct.critValue), c: 'amber' }, { v: num(ct.confirmed), l: 'Coming home', c: 'green' }])); }
  { const [c2, k2] = chg(ct.deltaValue || 0, money, true);
    add('ct', 'Value we have out', hero('Value out at other stations', money(ct.value), c2, k2, true) + tiles([{ v: num(ct.out), l: 'Tools out' }, { v: num(ct.avgDays), l: 'Avg days out' }, { v: money(ct.critValue), l: 'Out 30+ days', c: 'amber' }])); }
  add('ct', 'Why tools are out', bars((ct.reasons || []).slice(0, 5).map(r => ({ n: title(r.name), v: r.out, small: money(r.value) }))));
  add('ct', 'How long they have been out', bars((ct.bands || []).map(b => ({ n: title(b.name).replace(/\(.*\)/, m => m.toLowerCase().replace('days', 'days')), v: b.count, c: bandCls(b.name) }))));
  add('ct', 'Biggest stations by value', bars((ct.stations || []).slice().sort((a, b) => b.value - a.value).slice(0, 5).map(s => ({ n: s.name, v: s.value, label: money(s.value), small: num(s.tools) + (s.tools === 1 ? ' tool' : ' tools') }))));
  add('ct', 'Longest out', rowsList((ct.oldest || []).slice(0, 5).map(o => ({ a: o.id, b: String(o.days).toLowerCase(), c: 'red' }))));
  add('ct', 'Most valuable still out', rowsList((ct.priciest || []).slice(0, 5).map(o => ({ a: o.id, b: String(o.days).toLowerCase() + ' out', c: '' }))));
  add('ct', 'Tools out over time', `<div class="note">${num(f.out)} on ${f.d ? f.d.slice(5).replace('-', '/') : 'day one'} → <b style="color:#fff">${num(ct.out)}</b> now</div><div class="chartbox">${chart(tr, 'out', '#38bdf8', v => num(Math.round(v)))}</div>`);
  add('ct', 'Value out over time', `<div class="note">${money(f.value)} → <b style="color:#fff">${money(ct.value)}</b> now</div><div class="chartbox">${chart(tr, 'value', '#f87171', money)}</div>`);
  add('ct', 'Recovery rate', `<div class="gauge">${gauge(ct.recoveryRate)}<div class="gtxt"><div class="note">of tools we sent out have come back</div></div></div>` + tiles([{ v: num(ct.recovered), l: 'Tools returned' }, { v: money(ct.recoveredValue), l: 'Value recovered', c: 'green' }]) + `<div class="chartbox" style="flex:none">${chart(tr, 'rate', '#22c55e', v => Math.round(v * 100) + '%', [0, 1], [800, 420])}</div>`);
  add('ct', 'How far we have come', tiles([{ v: num(Math.abs(sb.out || 0)), l: (sb.out || 0) <= 0 ? 'Fewer tools out' : 'More tools out', s: 'since we started', c: (sb.out || 0) <= 0 ? 'green' : 'red' }, { v: money(Math.abs(sb.value || 0)), l: (sb.value || 0) <= 0 ? 'Less value out' : 'More value out', s: 'since we started', c: (sb.value || 0) <= 0 ? 'green' : 'red' }]) + tiles([{ v: num(Math.abs(sb.crit || 0)), l: 'Fewer 30+ day', s: 'since we started', c: 'green' }, { v: pct(ct.recoveryRate), l: 'Recovery rate', c: 'green' }]));
  add('ct', 'Reaching out to stations', tiles([{ v: num(oc.sent), l: 'Reminders sent' }, { v: num(oc.contacted), l: 'Stations contacted' }]) + tiles([{ v: num(oc.toolsEmailed), l: 'Tools emailed about' }, { v: esc(String(oc.withEmail || '-').split('/')[0].trim()), l: 'Emails on file', s: 'of ' + (String(oc.withEmail || '').split('/')[1] || '?').trim() + ' stations', c: 'amber' }]));

  // ALL OF ATL
  { const sl = String(atl.sinceLast || '').match(/Tools away (UP|DOWN) ([\d,]+)/i);
    const chip = sl ? [(sl[1].toUpperCase() === 'DOWN' ? '▼ ' : '▲ ') + sl[2] + ' since last update', sl[1].toUpperCase() === 'DOWN' ? 'good' : 'bad'] : [null, ''];
    add('atl', 'Tools away from home', hero('Tools away across ATL', num(atl.away), chip[0], chip[1]) + tiles([{ v: money(atl.value), l: 'Value away', c: 'red' }, { v: num(atl.overdue), l: 'Overdue', s: money(atl.overdueValue), c: 'amber' }, { v: num(atl.overYear), l: 'Over a year', c: 'amber' }])); }
  add('atl', 'Why tools are away', bars((atl.reasons || []).slice().sort((a, b) => b.tools - a.tools).slice(0, 5).map(r => ({ n: title(r.name), v: r.tools, small: r.late ? num(r.late) + ' late' : '' }))));
  add('atl', 'How long they have been gone', bars((atl.age || []).map(a => ({ n: title(a.name), v: a.tools, c: ageCls(a.name) }))));
  add('atl', 'Who is holding the money', bars((atl.holders || []).slice(0, 5).map(h => ({ n: cut(holder(h.name), 26), v: h.value, label: money(h.value), small: pct(h.share) }))));
  add('atl', 'Who holds the most tools', bars((atl.holders || []).slice().sort((a, b) => b.tools - a.tools).slice(0, 5).map(h => ({ n: cut(holder(h.name), 26), v: h.tools, small: money(h.value) }))));
  add('atl', 'Where the tools are', bars((atl.stations || []).slice(0, 5).map(s => ({ n: /^[A-Z]{3}$/.test(s.name) ? s.name : title(s.name), v: s.value, label: money(s.value), small: num(s.tools) + ' tools' }))));
  add('atl', 'Biggest kits away', rowsList((atl.kits || []).slice(0, 4).map(k => ({ a: k.id, sub: cut(title(k.desc || '').replace(/^Kit - /, ''), 40), b: money(k.value) }))) + tiles([{ v: money(atl.kitValue), l: 'Kits away', s: (atl.kitPct || 0) + '% of value' }, { v: num(atl.calCheck), l: 'Calibration check', c: 'amber' }]));

  // EVERYTHING
  if (hd.length) add('all', 'The headline numbers', `<div class="tiles" style="--n:2">${hd.slice(0, 4).map(h => `<div class="tile ${/DOWN/.test(h.delta) ? 'green' : /UP/.test(h.delta) ? 'red' : ''}"><div class="v">${h.money ? money(h.value) : num(h.value)}</div><div class="l">${esc(h.label)}</div><div class="s">${esc(String(h.delta || '').replace(/ vs 30 days ago/, '').replace(/^UP/, '▲').replace(/^DOWN/, '▼'))} vs 30 days</div></div>`).join('')}</div>`);
  [[0, 1], [2, 3], [4, 5]].forEach(p => { const ls = p.map(i => L[i]).filter(Boolean); if (ls.length) add('all', 'In plain words', says(ls)); });
  return S;
}

// ── showing them ─────────────────────────────────────────────────────────────
const TAGS = { ct: 'CT', atl: 'ATL', all: 'ALL' };
function countUps(root) {
  root.querySelectorAll('.hero .v, .tile .v').forEach(el => {
    const txt = el.textContent, m = txt.match(/^(\$?)([\d,.]+)([KM%]?)$/); if (!m) return;
    const end = parseFloat(m[2].replace(/,/g, '')), dec = (m[2].split('.')[1] || '').length, t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 3), v = end * e;
      el.textContent = m[1] + (dec ? v.toFixed(dec) : Math.round(v).toLocaleString('en-US')) + m[3]; if (k < 1) requestAnimationFrame(step); else el.textContent = txt; };
    requestAnimationFrame(step);
  });
}
function show(i) {
  cur = i;
  document.querySelectorAll('.scr').forEach((e, k) => { const on = k === i; if (on && !e.classList.contains('on')) countUps(e); e.classList.toggle('on', on); });
}
function mount() {
  const keep = Math.min(cur, Math.max(0, screens.length - 1));
  const t = new Date(D.asOf), hrs = (Date.now() - t.getTime()) / 36e5;
  const lbl = t.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const asof = hrs > 36 ? `<span class="stale">Numbers are ${Math.floor(hrs / 24)} day${hrs >= 48 ? 's' : ''} old</span>` : 'Updated ' + lbl;
  $('#stage').innerHTML = screens.map((s, i) => `<section class="scr ${s.tag}"><div class="top"><span class="tag">${TAGS[s.tag]}</span><div class="ttl">${esc(s.t)}</div></div><div class="body">${s.h}</div><div class="foot">${asof}</div></section>`).join('');
  show(keep);
  if (timer) clearInterval(timer);
  timer = setInterval(() => show((cur + 1) % screens.length), ROTATE_SEC * 1000);
}

// ── live board (left): the board's own TV view, scaled to the box ────────────
const BASE_W = 1320;
function fitBoard() {
  const box = $('#bframe'), f = $('#bf'), w = box.clientWidth, h = box.clientHeight; if (!w || !h) return;
  const k = w / BASE_W;
  f.style.width = BASE_W + 'px'; f.style.height = Math.ceil(h / k) + 'px'; f.style.transform = 'scale(' + k + ')';
}
$('#bf').src = BOARD + '/?tv';
addEventListener('resize', fitBoard);

async function loadData() {
  try { const r = await fetch(BOARD + '/api/dashboard', { cache: 'no-store' }); if (r.ok) { const d = await r.json(); if (d && d.ct) { try { localStorage.setItem('ctwall-data', JSON.stringify(d)); } catch (e) {} return d; } } } catch (e) {}
  try { const c = JSON.parse(localStorage.getItem('ctwall-data') || 'null'); if (c && c.ct) return c; } catch (e) {}
  try { const r = await fetch('seed.json', { cache: 'no-store' }); return await r.json(); } catch (e) { return null; }
}
let sig = '';
async function refresh() {
  const d = await loadData(); if (!d) return;
  const s = JSON.stringify(d); if (s === sig) return;
  sig = s; D = d; screens = buildScreens(); mount();
}
(async function () {
  fitBoard(); await refresh();
  setInterval(refresh, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { refresh(); fitBoard(); } });
})();
</script>
