<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CT Wall</title>
<meta name="theme-color" content="#050e1a">
<style>
  :root { --bg:#050e1a; --card:#0b1a2c; --line:#17304d; --ink:#eef5fc; --mut:#86a3c2; --red:#ef4444; --green:#22c55e; --amber:#f59e0b; --blue:#38bdf8; --navy:#0d4a8a; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; background: var(--bg); color: var(--ink); }
  .wrap { height: 100vh; display: grid; grid-template-columns: 61fr 39fr; gap: .8vw; padding: 0; }

  /* left: the live board, exactly as it looks on the TV view */
  #bframe { position: relative; overflow: hidden; background: #06111f; }
  #bf { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; pointer-events: none; background: #06111f; }

  /* right: one simple screen at a time */
  .side { position: relative; padding: 1.4vh .9vw 1.4vh 0; display: flex; flex-direction: column; min-width: 0; }
  .stage { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(var(--cols, 1), 1fr); gap: .8vw; }
  .wrap.stack { grid-template-columns: 1fr; grid-template-rows: var(--bh, 30vh) 1fr; gap: .6vh; }
  .wrap.stack .side { padding: 0 .9vw 1.2vh .9vw; }
  #stage2 { display: none; }
  .wrap.mixed { grid-template-rows: var(--bh, 50vh) 1fr; gap: .6vh .8vw; }
  .wrap.mixed #bframe { grid-area: 1 / 1; }
  .wrap.mixed .side { grid-area: 1 / 2 / 3 / 3; }
  .wrap.mixed #stage2 { grid-area: 2 / 1; display: grid; padding: 0 0 1.2vh 0; min-height: 0; }
  .scr { position: relative; display: none; container-type: size; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 1.2vw; padding: 2.4vh 1.6vw; overflow: hidden; }
  .scr.on { display: flex; animation: scrin .7s ease-out; }
  @keyframes scrin { from { opacity: 0; transform: translateY(1.5vh); } to { opacity: 1; transform: none; } }
  .scr::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: .5vw; background: var(--c); }
  .scr.ct { --c: #ef4444; } .scr.atl { --c: #38bdf8; } .scr.all { --c: #22c55e; }
  .top { display: flex; flex-direction: column; align-items: flex-start; gap: 1.2cqh; flex: none; margin-bottom: 1.6cqh; }
  .tag { padding: .5cqh 1.96cqh; border-radius: 999px; font-size: 2.2cqh; font-weight: 800; letter-spacing: .14em; color: #fff; background: var(--c); }
  .ttl { font-size: 4.6cqh; font-weight: 800; letter-spacing: .02em; line-height: 1.1; }
    .stale { color: var(--amber); font-weight: 700; }
  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 2.6cqh; justify-content: space-evenly; }
  .foot { flex: none; margin-top: 1.2cqh; font-size: 1.9cqh; color: var(--mut); text-align: right; }

  /* big number */
  .hero { display: flex; flex-direction: column; gap: .8cqh; }
  .hero .l { font-size: 2.6cqh; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); }
  .hero .v { font-size: 19cqh; font-weight: 800; line-height: .95; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .hero .v.m { font-size: 15cqh; }
  .chip { align-self: flex-start; display: inline-flex; align-items: center; gap: 1.07cqh; margin-top: 1.2cqh; padding: .8cqh 2.31cqh; border-radius: 999px; font-size: 3.2cqh; font-weight: 800; }
  .chip.good { background: rgba(34,197,94,.18); color: #6ee7a0; } .chip.bad { background: rgba(239,68,68,.2); color: #ff8a8a; } .chip.flat { background: rgba(134,163,194,.15); color: var(--mut); }
  .tiles { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 1.78cqh; }
  .tile { background: #0f2238; border: 1px solid var(--line); border-radius: 1.78cqh; padding: 1.8cqh 1.78cqh; min-width: 0; }
  .tiles[style*="--n:3"] .tile .v { font-size: 4.2cqh; }
  .tile .v { white-space: nowrap; font-size: 6cqh; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .tiles[style*="--n:2"] .tile .v { font-size: 7cqh; }
  .tile .l { margin-top: 1cqh; font-size: 2.1cqh; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mut); }
  .tile .s { margin-top: .5cqh; font-size: 2.1cqh; color: #b5cbe2; }
  .tile.red .v { color: #ff7b7b; } .tile.amber .v { color: #fbbf24; } .tile.green .v { color: #5eea96; }

  /* bars */
  .bars { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; gap: 1cqh; }
  .bar .r1 { display: flex; align-items: baseline; justify-content: space-between; gap: 1.78cqh; margin-bottom: .8cqh; }
  .bar .n { font-size: 3.9cqh; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .x { font-size: 4.2cqh; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar .x small { margin-left: 1.07cqh; font-size: 2.2cqh; font-weight: 600; color: var(--mut); }
  .bar .t { height: 3cqh; background: #12263d; border-radius: 99px; overflow: hidden; }
  .bar .t b { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #1d6fc4, #38bdf8); width: 0; transition: width 1.1s cubic-bezier(.2,.7,.2,1); }
  .scr.on .bar .t b { width: var(--w); }
  .bar.g .t b { background: linear-gradient(90deg, #15803d, #4ade80); } .bar.y .t b { background: linear-gradient(90deg, #ca8a04, #facc15); }
  .bar.o .t b { background: linear-gradient(90deg, #c2410c, #fb923c); } .bar.r .t b { background: linear-gradient(90deg, #b91c1c, #f87171); }

  /* table */
  .rows { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; gap: 1cqh; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 1.78cqh; background: #0f2238; border: 1px solid var(--line); border-radius: 1.78cqh; padding: 2.6cqh 2.49cqh; }
  .row .a { font-size: 4cqh; font-weight: 800; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .a small { display: block; margin-top: .3cqh; font-size: 2cqh; font-weight: 500; color: var(--mut); overflow: hidden; text-overflow: ellipsis; }
  .row .b { font-size: 4.2cqh; font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .row .b.red { color: #ff7b7b; } .row .b.amber { color: #fbbf24; }
  .note { font-size: 2.8cqh; color: var(--mut); line-height: 1.35; }

  /* gauge */
  .gauge { display: flex; align-items: center; gap: 3.56cqh; }
  .gauge svg { width: 30cqh; height: 30cqh; flex: none; }
  .gauge .gv { font-size: 31px; font-weight: 800; fill: #fff; }
  .gtxt { display: flex; flex-direction: column; gap: 1.2cqh; }

  /* chart */
  .chartbox { flex: 1; min-height: 0; display: flex; align-items: center; }
  .chartbox svg { width: 100%; height: 100%; }

  /* plain words */
  .says { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; gap: 2.2cqh; }
  .say { background: #0f2238; border: 1px solid var(--line); border-radius: 1.78cqh; padding: 2cqh 2.49cqh; }
  .say b { display: block; font-size: 2.2cqh; letter-spacing: .1em; text-transform: uppercase; color: var(--blue); margin-bottom: .7cqh; }
  .say span { font-size: 3cqh; line-height: 1.3; font-weight: 500; }
  .empty { margin: auto; font-size: 3cqh; color: var(--mut); text-align: center; }
  .scr.mv { --c: #a78bfa; } .scr.co { --c: #f59e0b; } .scr.act { --c: #2dd4bf; } .scr.tg { --c: #f472b6; }
  .tag { white-space: nowrap; }
  .sub { flex: none; margin: -.6cqh 0 2.2cqh; font-size: 2.7cqh; font-weight: 500; line-height: 1.25; color: #b5cbe2; }
  .goals { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; gap: 1.2cqh; }
  .goal { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2cqh; background: #0f2238; border: 1px solid var(--line); border-radius: 1.78cqh; padding: 1.6cqh 2.4cqh; }
  .goal .a { font-size: 3.1cqh; font-weight: 800; min-width: 0; }
  .goal .a small { display: block; margin-top: .4cqh; font-size: 2.4cqh; font-weight: 600; color: #b5cbe2; }
  .goal .st { font-size: 2.9cqh; font-weight: 800; padding: .9cqh 2.2cqh; border-radius: 999px; white-space: nowrap; }
  .goal .st.g { background: rgba(34,197,94,.2); color: #6ee7a0; } .goal .st.y { background: rgba(245,158,11,.22); color: #fbbf24; } .goal .st.r { background: rgba(239,68,68,.22); color: #ff8a8a; }
</style>
</head>
<body>
<div class="wrap">
  <div id="bframe"><iframe id="bf" title="Live Board" scrolling="no"></iframe></div>
  <div id="stage2"></div>
  <div class="side"><div class="stage" id="stage"><div class="empty">Loading the numbers…</div></div></div>
</div>

<script>
'use strict';
const DEFAULT_BOARD = 'https://atl-dept593-board.onrender.com';
const qs = new URLSearchParams(location.search);
const BOARD = /^http:\/\/localhost(:\d+)?$/.test(qs.get('board') || '') ? qs.get('board') : DEFAULT_BOARD;
const ROTATE_SEC = Math.max(8, parseInt(qs.get('sec') || '30', 10));
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = n => Number(n || 0).toLocaleString('en-US');
const money = n => { n = Number(n || 0); const a = Math.abs(n);
  return a >= 1e6 ? '$' + (n / 1e6).toFixed(a >= 1e7 ? 1 : 2).replace(/\.?0+$/, '') + 'M' : a >= 1e3 ? '$' + Math.round(n / 1e3).toLocaleString('en-US') + 'K' : '$' + Math.round(n); };
const moneyFull = n => '$' + Math.round(Number(n || 0)).toLocaleString('en-US');
const pct = n => Math.round(Number(n || 0) * 100) + '%';
const title = s => String(s || '').toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase()).replace(/\bAos\b/, 'AOS').replace(/\bRon\b/, 'RON').replace(/\bRad\b/, 'RAD').replace(/\bAtl\b/, 'ATL');
const holder = n => { n = String(n || '').replace(/^\d+\w*\s+/, '') || String(n || ''); return /^\(?blank\)?$/i.test(n) ? 'Unassigned' : n; };
const cut = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };

let scrEls = [], D = null, cur = 0, screens = [], timer = null, cols = 1, board = null;

// ── building blocks ──────────────────────────────────────────────────────────
const hero = (label, val, chip, cls, big) => `<div class="hero"><div class="l">${esc(label)}</div><div class="v${big ? ' m' : ''}">${val}</div>${chip ? `<div class="chip ${cls || 'flat'}">${chip}</div>` : ''}</div>`;
const tiles = list => `<div class="tiles" style="--n:${list.length}">${list.map(t => `<div class="tile ${t.c || ''}"><div class="v">${t.v}</div><div class="l">${esc(t.l)}</div>${t.s ? `<div class="s">${esc(t.s)}</div>` : ''}</div>`).join('')}</div>`;
const bars = rows => {
  const max = Math.max(1, ...rows.map(r => r.v));
  return `<div class="bars">` + rows.map(r => `<div class="bar ${r.c || ''}"><div class="r1"><div class="n">${esc(r.n)}</div><div class="x">${r.label != null ? r.label : num(r.v)}${r.small ? `<small>${esc(r.small)}</small>` : ''}</div></div><div class="t"><b style="--w:${Math.max(3, r.v / max * 100).toFixed(1)}%"></b></div></div>`).join('') + `</div>`;
};
const rowsList = list => `<div class="rows">` + list.map(r => `<div class="row"><div class="a">${esc(r.a)}${r.sub ? `<small>${esc(r.sub)}</small>` : ''}</div><div class="b ${r.c || ''}">${esc(r.b)}</div></div>`).join('') + `</div>`;
const says = list => `<div class="says">` + list.map(l => `<div class="say"><b>${esc(l.label)}</b><span>${esc(l.text)}</span></div>`).join('') + `</div>`;
const chg = (n, fmt, goodWhenDown) => n === 0 ? ['no change', 'flat'] : [(n < 0 ? '▼ ' : '▲ ') + fmt(Math.abs(n)) + ' since last update', (n < 0) === !!goodWhenDown ? 'good' : 'bad'];

function gauge(p) {
  const r = 52, c = 2 * Math.PI * r, v = Math.max(0, Math.min(1, p));
  return `<svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="${r}" fill="none" stroke="#12263d" stroke-width="14"/><circle cx="70" cy="70" r="${r}" fill="none" stroke="#22c55e" stroke-width="14" stroke-linecap="round" stroke-dasharray="${(c * v).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 70 70)"/><text x="70" y="70" text-anchor="middle" dominant-baseline="central" class="gv">${Math.round(v * 100)}%</text></svg>`;
}

// one clean line chart; the vertical scale is fixed or rounded to nice numbers so labels never run past what makes sense
function chart(points, key, color, fmt, fixed, dims) {
  if (!points || points.length < 2) return '<div class="empty">Not enough history yet</div>';
  const W = 800, H = dims ? dims[1] : 900, pad = { l: 140, r: 36, t: 30, b: 64 };
  const vals = points.map(p => p[key]);
  let lo, hi;
  if (fixed) { lo = fixed[0]; hi = fixed[1]; }
  else { lo = 0; hi = Math.max(...vals); const st = Math.pow(10, Math.floor(Math.log10(hi || 1))); hi = Math.ceil(hi / (st / 2)) * (st / 2); }
  const X = i => pad.l + i * (W - pad.l - pad.r) / (points.length - 1);
  const Y = v => pad.t + (hi - v) * (H - pad.t - pad.b) / (hi - lo);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4, y = Y(v); g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y}" y2="${y}" stroke="#1a3452"/><text x="${pad.l - 16}" y="${y + 11}" text-anchor="end" font-size="36" fill="#9bb7d4">${fmt(v)}</text>`; }
  const path = points.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(p[key]).toFixed(1)).join(' ');
  const md = d => { const p = d.split('-'); return p.length < 3 || d.length <= 7 ? ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+p[1] - 1] : +p[1] + '/' + +p[2]; };
  const last = points.length - 1, mid = Math.floor(last / 2);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}
    <path d="${path} L${X(last)},${H - pad.b} L${X(0)},${H - pad.b} Z" fill="${color}" opacity=".16"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(last)}" cy="${Y(vals[last])}" r="13" fill="${color}" stroke="#0b1a2c" stroke-width="4"/>
    <text x="${X(0)}" y="${H - 14}" font-size="32" fill="#9bb7d4" text-anchor="start">${md(points[0].d)}</text>
    <text x="${X(mid)}" y="${H - 14}" font-size="32" fill="#9bb7d4" text-anchor="middle">${md(points[mid].d)}</text>
    <text x="${X(last)}" y="${H - 14}" font-size="32" fill="#9bb7d4" text-anchor="end">${md(points[last].d)}</text></svg>`;
}
const bandCls = n => /MONITOR/.test(n) ? 'g' : /CONTACT/.test(n) ? 'y' : /FOLLOW/.test(n) ? 'o' : /CRITICAL|UNACCEPT/.test(n) ? 'r' : '';
const ageCls = n => /OVER/.test(n) ? 'r' : /91/.test(n) ? 'o' : /31/.test(n) ? 'y' : /CLOCK/.test(n) ? '' : 'g';

// ── the screens (one idea each, big enough to read from across the room) ─────
function buildScreens() {
  const ct = D.ct || {}, atl = D.atl || {}, all = D.all || {}, tr = D.trend || [], f = tr[0] || {}, X = D.x || {};
  const L = all.lines || [], hd = all.headline || [], oc = ct.outreach || {}, sb = ct.sinceBaseline || {};
  const S = [];
  // add(group, plain-English title, what-it-means line, content)
  const add = (tag, t, sub, h) => S.push({ tag, t, sub, h });
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const monName = m => { const p = String(m || '').split('-'); return p.length > 1 ? MON[(+p[1] || 1) - 1] + ' ' + p[0] : String(m || ''); };
  const room = s => title(String(s || '').replace(/INTERNATIONA$/i, 'INTERNATIONAL').replace(/\s*TOOL(\s*R(O|OO|OOM)?)?$/i, '').replace(/^593\s+/, '').replace(/\s593\s/, ' ').replace(/\s*-\s*$/, '')).replace(/^(\w{3})\s/, (m, a) => a.toUpperCase() + ' ').replace(/\bToc5\b/, 'TOC5');
  const SHIFT = { '1ST': '1st Shift (6a–2p)', '2ND': '2nd Shift (2p–11p)', '3RD': '3rd Shift (11p–6a)', '1ST WEEKEND': 'Weekend 1st (6:30a–6:30p)', '3RD WEEKEND': 'Weekend 3rd (6:30p–6:30a)' };
  const shiftName = s => SHIFT[String(s || '').toUpperCase()] || title(s);

  // ───────────────────────── CENTRAL TOOLING ─────────────────────────
  { const [c1, k1] = chg(ct.deltaOut || 0, num, true);
    add('ct', 'Central Tooling tools still out', 'Tools we sent to other stations that have not come back yet',
      hero('Tools out right now', num(ct.out), c1, k1) + tiles([{ v: money(ct.value), l: 'What they are worth', c: 'red' }, { v: num(ct.crit), l: 'Gone 30+ days', s: money(ct.critValue) + ' worth', c: 'amber' }, { v: num(ct.confirmed), l: 'On the way home', s: 'return shipment confirmed', c: 'green' }])); }
  { const [c2, k2] = chg(ct.deltaValue || 0, money, true);
    add('ct', 'Dollar value of tools still out', 'What the Central Tooling tools sitting at other stations are worth',
      hero('Dollars out at other stations', money(ct.value), c2, k2, true) + tiles([{ v: num(ct.out), l: 'Number of tools' }, { v: num(ct.avgDays), l: 'Average days out' }, { v: money(ct.critValue), l: 'Value gone 30+ days', c: 'amber' }])); }
  add('ct', 'Why our tools are out', 'Number of tools out, for each reason (AOS = aircraft on the ground)',
    bars((ct.reasons || []).slice(0, 5).map(r => ({ n: title(r.name), v: r.out, small: money(r.value) }))));
  add('ct', 'How long our tools have been out', 'Number of tools out, by how many days they have been gone',
    bars((ct.bands || []).map(b => ({ n: title(b.name).replace(/\((.*?)\)/, (m, a) => '(' + a.replace(/-/g, '–') + ' days)'), v: b.count, c: bandCls(b.name) }))));
  add('ct', 'Stations holding the most of our money', 'Dollar value of our tools sitting at each station',
    bars((ct.stations || []).slice().sort((a, b) => b.value - a.value).slice(0, 5).map(s => ({ n: s.name, v: s.value, label: money(s.value), small: num(s.tools) + (s.tools === 1 ? ' tool' : ' tools') }))));
  add('ct', 'The tools that have been out longest', 'Tool number and how many days it has been gone',
    rowsList((ct.oldest || []).slice(0, 5).map(o => ({ a: o.id, b: String(o.days).toLowerCase(), c: 'red' }))));
  add('ct', 'The most valuable tools still out', 'Tool number and how long it has been out',
    rowsList((ct.priciest || []).slice(0, 5).map(o => ({ a: o.id, b: String(o.days).toLowerCase() + ' out', c: '' }))));
  add('ct', 'Are fewer tools out than before?', 'Number of Central Tooling tools out, over time',
    `<div class="note">${num(f.out)} on ${f.d ? f.d.slice(5).replace('-', '/') : 'day one'} → <b style="color:#fff">${num(ct.out)}</b> today</div><div class="chartbox">${chart(tr, 'out', '#38bdf8', v => num(Math.round(v)))}</div>`);
  add('ct', 'Is less money out than before?', 'Dollar value of Central Tooling tools out, over time',
    `<div class="note">${money(f.value)} → <b style="color:#fff">${money(ct.value)}</b> today</div><div class="chartbox">${chart(tr, 'value', '#f87171', money)}</div>`);
  add('ct', 'Share of our tools that came back', 'Of all the tools we sent out, how many have been returned',
    `<div class="gauge">${gauge(ct.recoveryRate)}<div class="gtxt"><div class="note">of tools sent out have come back</div></div></div>` + tiles([{ v: num(ct.recovered), l: 'Tools returned' }, { v: money(ct.recoveredValue), l: 'Dollars recovered', c: 'green' }]) + `<div class="chartbox" style="flex:1;min-height:0">${chart(tr, 'rate', '#22c55e', v => Math.round(v * 100) + '%', [0, 1], [800, 420])}</div>`);
  add('ct', 'How far we have come', 'Change since we started tracking on ' + (f.d ? f.d.slice(5).replace('-', '/') : 'day one'),
    tiles([{ v: num(Math.abs(sb.out || 0)), l: (sb.out || 0) <= 0 ? 'Fewer tools out' : 'More tools out', s: 'than when we started', c: (sb.out || 0) <= 0 ? 'green' : 'red' }, { v: money(Math.abs(sb.value || 0)), l: (sb.value || 0) <= 0 ? 'Less money out' : 'More money out', s: 'than when we started', c: (sb.value || 0) <= 0 ? 'green' : 'red' }]) + tiles([{ v: num(Math.abs(sb.crit || 0)), l: 'Fewer tools gone 30+ days', s: 'than when we started', c: 'green' }, { v: pct(ct.recoveryRate), l: 'Share returned', c: 'green' }]));
  add('ct', 'Reminder emails to stations', 'Emails we sent asking stations to send our tools back',
    tiles([{ v: num(oc.sent), l: 'Emails sent' }, { v: num(oc.contacted), l: 'Stations emailed' }]) + tiles([{ v: num(oc.toolsEmailed), l: 'Tools we emailed about' }, { v: esc(String(oc.withEmail || '-').split('/')[0].trim()), l: 'Stations with an email on file', s: 'out of ' + (String(oc.withEmail || '').split('/')[1] || '?').trim(), c: 'amber' }]));
  if ((X.inbound || []).length) {
    const ib = X.inbound, tot = ib.reduce((s, r) => s + (r.price || 0), 0);
    add('ct', 'Tools on their way back to us', 'A return shipment is documented for each of these',
      rowsList(ib.slice(0, 5).map(r => ({ a: cut(title(r.desc), 30), sub: r.id + ' · coming from ' + r.from + ' · ' + r.reason, b: moneyFull(r.price) }))) + `<div class="note">${ib.length} tools, ${moneyFull(tot)} total</div>`); }

  // ───────────────────────── CT SHIPMENTS (who handles what) ─────────────────────────
  if (X.moves && (X.moves.all || []).length) {
    const m = X.moves, mm = String(m.monthName || '').match(/\((\w+)\s+(\d{4})\)/), mn = mm ? 'so far in ' + title(mm[1]) + ' ' + mm[2] : 'this month';
    add('mv', 'Shipments we have handled', 'Tools Central Tooling moved: shipped out, sent between stations, or brought back',
      hero('Shipments handled ' + mn, num(m.thisMonth), null, '', true) + tiles([{ v: num(m.lastMonth), l: 'All of last month' }, { v: num(m.year), l: 'So far this year' }, { v: num(m.allTime), l: 'Since we started counting' }]));
    add('mv', 'Which shift handles the most shipments', 'Number of shipments each shift handled ' + mn,
      bars(m.all.map(r => ({ n: shiftName(r.name), v: r.total, small: pct(r.share) }))));
    if ((m.plane || []).length) add('mv', 'Aircraft-down shipments by shift', 'Shipments for planes that cannot fly until the tool arrives (AOS and similar), ' + mn,
      bars(m.plane.map(r => ({ n: shiftName(r.name), v: r.total, small: pct(r.share) }))));
    add('mv', 'Dollar value we shipped, by shift', 'Dollar value of tools sent out of ATL by each shift ' + mn,
      bars(m.all.map(r => ({ n: shiftName(r.name), v: r.atlValue, label: money(r.atlValue), small: num(r.atl) + ' sent' }))));
    add('mv', 'Busy times and top reasons', 'What the shipment record shows since we started counting',
      tiles([{ v: esc(title(m.busiestDay)), l: 'Busiest day of the week', s: m.busiestDayNote }, { v: esc(m.topReason), l: 'Most common reason', s: m.topReasonNote }]) + tiles([{ v: pct(m.planeShare), l: 'Of shipments are for planes that are down', s: m.planeNote, c: 'red' }, { v: pct(m.weekend), l: 'Of shipments happen on weekends' }]));
  }

  // ───────────────────────── CHECKED OUT TO PEOPLE AND VENDORS ─────────────────────────
  if (X.people) {
    const p = X.people;
    add('co', 'Tools checked out to people', 'ATL tools signed out to individual employees right now',
      hero('Tools checked out to people', num(p.peopleTools), null, '') + tiles([{ v: money(p.peopleValue), l: 'What they are worth', c: 'amber' }, { v: num(p.mroTools), l: 'More are at repair vendors' }, { v: num(p.bothTools), l: 'Both together' }]));
    if ((p.age || []).length) add('co', 'How long people have had tools', 'Tools checked out to people, by how long ago they were signed out',
      bars(p.age.map(a => ({ n: title(a.name), v: a.count, small: money(a.value), c: /OVER/.test(a.name) ? 'r' : /^30/.test(a.name) ? 'y' : 'g' }))));
    add('co', 'Tools at repair vendors', 'ATL tools on loan to outside repair companies (MRO) right now',
      hero('Tools at vendors', num(p.mroTools), null, '', true) + tiles([{ v: money(p.mroValue), l: 'What they are worth', c: 'red' }, { v: pct(p.bothTools ? p.mroTools / p.bothTools : 0), l: 'Of all checked-out tools' }]));
    if ((p.vendors || []).length) add('co', 'Vendors holding the most of our money', 'Dollar value of our tools at each repair vendor',
      bars(p.vendors.slice(0, 5).map(v => ({ n: cut(title(v.name), 28), v: v.value, label: money(v.value), small: num(v.tools) + ' tools' }))));
    add('co', 'Tools we have gotten back', 'Checked-out tools returned since tracking began',
      tiles([{ v: num(p.recovered), l: 'Tools returned', c: 'green' }, { v: num(p.deleted), l: 'Written off', s: 'taken off the list', c: 'amber' }]));
    if ((p.lists || []).length) add('co', 'Checked-out tools needing a look', 'Number of tools in each follow-up list',
      bars(p.lists.map(l => ({ n: title(l.name).replace(/\bAny Age\b/, 'any age'), v: l.count, small: l.value ? money(l.value) : '' }))));
  }

  // ───────────────────────── ALL OF ATL ─────────────────────────
  { const sl = String(atl.sinceLast || '').match(/Tools away (UP|DOWN) ([\d,]+)/i);
    const chip = sl ? [(sl[1].toUpperCase() === 'DOWN' ? '▼ ' : '▲ ') + sl[2] + ' since last update', sl[1].toUpperCase() === 'DOWN' ? 'good' : 'bad'] : [null, ''];
    add('atl', 'ATL tools that are away from home', 'Every tool that belongs to ATL but is somewhere else right now',
      hero('ATL tools away right now', num(atl.away), chip[0], chip[1]) + tiles([{ v: money(atl.value), l: 'What they are worth', c: 'red' }, { v: num(atl.overdue), l: 'Past their due date', s: money(atl.overdueValue) + ' worth', c: 'amber' }, { v: num(atl.overYear), l: 'Gone over a year', c: 'amber' }])); }
  add('atl', 'Why ATL tools are away', 'Number of ATL tools away, for each reason',
    bars((atl.reasons || []).slice().sort((a, b) => b.tools - a.tools).slice(0, 5).map(r => ({ n: /wrong crib/i.test(r.name) ? 'Right station, wrong crib' : title(r.name), v: r.tools, small: r.late ? num(r.late) + ' late' : '' }))));
  add('atl', 'How long ATL tools have been gone', 'Number of ATL tools away, by how long',
    bars((atl.age || []).map(a => ({ n: title(a.name), v: a.tools, c: ageCls(a.name) }))));
  add('atl', 'Who is holding the most money', 'Dollar value of ATL tools held by each group',
    bars((atl.holders || []).slice(0, 5).map(h => ({ n: cut(holder(h.name), 26), v: h.value, label: money(h.value), small: pct(h.share) }))));
  add('atl', 'Who is holding the most tools', 'Number of ATL tools held by each group',
    bars((atl.holders || []).slice().sort((a, b) => b.tools - a.tools).slice(0, 5).map(h => ({ n: cut(holder(h.name), 26), v: h.tools, small: money(h.value) }))));
  add('atl', 'Where ATL tools are right now', 'Dollar value of ATL tools at each kind of place',
    bars((atl.stations || []).slice(0, 5).map(s => ({ n: /^[A-Z]{3}$/.test(s.name) ? s.name : title(s.name), v: s.value, label: money(s.value), small: num(s.tools) + ' tools' }))));
  add('atl', 'Biggest tool kits that are away', 'Large kits that are not at ATL, with their value',
    rowsList((atl.kits || []).slice(0, 4).map(k => ({ a: k.id, sub: cut(title(k.desc || '').replace(/^Kit - /, ''), 40), b: money(k.value) }))) + tiles([{ v: money(atl.kitValue), l: 'All kits away', s: (atl.kitPct || 0) + '% of the money away' }, { v: num(atl.calCheck), l: 'Waiting on calibration check', c: 'amber' }]));

  // ───────────────────────── TOOL ROOM ACTIVITY ─────────────────────────
  const A = X.activity || {};
  if (A.issuance) {
    const i = A.issuance;
    add('act', 'Tools checked out of tool rooms', 'Every tool signed out of a tool room in the last 30 days',
      hero('Times tools were checked out', num(i.outTx), null, '') + tiles([{ v: num(i.outTools), l: 'Different tools used' }, { v: money(i.outValue), l: 'Value of those tools' }, { v: num(i.inTx), l: 'Times tools were returned', c: 'green' }]));
  }
  if ((A.monthly || []).length > 2) {
    const mp = A.monthly.map(r => ({ d: r.m, out: r.out })), lastM = A.monthly[A.monthly.length - 1], prevM = A.monthly[A.monthly.length - 2];
    add('act', 'Tool room traffic, month by month', 'Number of tool checkouts each month' + (lastM ? ' (' + monName(lastM.m) + ' is still in progress)' : ''),
      `<div class="note">${monName(prevM.m)}: <b style="color:#fff">${num(prevM.out)}</b> checkouts</div><div class="chartbox">${chart(mp, 'out', '#a78bfa', v => num(Math.round(v)))}</div>`);
  }
  if (A.rooms && (A.rooms.rows || []).length) add('act', 'Busiest tool rooms', 'Tool checkouts so far in ' + monName(A.rooms.month) + ', by tool room',
    bars(A.rooms.rows.slice().sort((a, b) => b.out - a.out).slice(0, 6).map(r => ({ n: room(r.room), v: r.out, small: r.station }))));
  if (A.stations && (A.stations.rows || []).length) add('act', 'Tool room use by station', 'Tool checkouts so far in ' + monName(A.stations.month) + ', by station',
    bars(A.stations.rows.slice(0, 6).map(r => ({ n: r.name, v: r.out }))));
  if (A.shifts && (A.shifts.rows || []).length) add('act', 'Tool room use by shift', 'Tool checkouts so far in ' + monName(A.shifts.month) + ', all stations together',
    bars(A.shifts.rows.map(r => ({ n: title(r.name), v: r.out }))));
  if ((A.types || []).length) add('act', 'Other things tool rooms do', 'Number of other transactions (not checkouts), such as inventory, shipping and calibration',
    bars(A.types.slice(0, 6).map(t => ({ n: title(t.name), v: t.n }))));
  if ((A.topTools || []).length) add('act', 'Most checked-out tools', 'The tools signed out the most times since records began',
    rowsList(A.topTools.slice(0, 5).map(t => ({ a: cut(title(t.desc), 28), sub: t.id, b: num(t.n) + ' times' }))));

  // ───────────────────────── OUR GOALS ─────────────────────────
  if ((X.targets || []).length) {
    const T = X.targets, fmt = t => /average days/i.test(t.name) ? v => Math.round(v) + ' days' : /rate/i.test(t.name) ? v => pct(v) : /value|recovered since/i.test(t.name) ? money : num;
    const stat = s => /MET|PACE/i.test(s) ? ['g', /MET/i.test(s) ? 'Goal met' : 'On pace'] : /BEHIND/i.test(s) ? ['y', 'Behind'] : ['r', 'Wrong way'];
    const goal = list => `<div class="goals">` + list.map(t => { const f = fmt(t), s = stat(t.status); return `<div class="goal"><div class="a">${esc(t.name.replace(/\s*\(cumulative\)/i, ''))}<small>Now ${esc(f(t.now))} · Goal ${esc(f(t.target))}</small></div><div class="st ${s[0]}">${s[1]}</div></div>`; }).join('') + `</div>`;
    const ctg = T.filter(t => /^CT:|recovered since/i.test(t.name)), atg = T.filter(t => !/^CT:|recovered since/i.test(t.name));
    if (ctg.length) add('tg', 'Central Tooling goals', 'Where we are against the targets we set', goal(ctg.slice(0, 6)));
    for (let i = 0; i < atg.length; i += 5) add('tg', 'ATL goals' + (atg.length > 5 ? ' (' + (i / 5 + 1) + ' of ' + Math.ceil(atg.length / 5) + ')' : ''), 'Where ATL stands against the targets we set', goal(atg.slice(i, i + 5)));
  }

  // ───────────────────────── THE BIG PICTURE ─────────────────────────
  if (hd.length) add('all', 'The headline numbers', 'How the main numbers compare with 30 days ago', `<div class="tiles" style="--n:2">${hd.slice(0, 4).map(h => `<div class="tile ${/DOWN/.test(h.delta) ? 'green' : /UP/.test(h.delta) ? 'red' : ''}"><div class="v">${h.money ? money(h.value) : num(h.value)}</div><div class="l">${esc(h.label)}</div><div class="s">${esc(String(h.delta || '').replace(/ vs 30 days ago/, '').replace(/^UP/, '▲').replace(/^DOWN/, '▼'))} vs 30 days</div></div>`).join('')}</div>`);
  [[0, 1], [2, 3], [4, 5]].forEach((p, n) => { const ls = p.map(i => L[i]).filter(Boolean); if (ls.length) add('all', 'The numbers in plain words (' + (n + 1) + ' of 3)', 'A short sentence for each number', says(ls)); });
  return S;
}

// ── showing them ─────────────────────────────────────────────────────────────
const TAGS = { ct: 'CENTRAL TOOLING', mv: 'CT SHIPMENTS', co: 'CHECKED-OUT TOOLS', atl: 'ALL OF ATL', act: 'TOOL ROOMS', tg: 'OUR GOALS', all: 'THE BIG PICTURE' };
function countUps(root) {
  root.querySelectorAll('.hero .v, .tile .v').forEach(el => {
    const txt = el.textContent, m = txt.match(/^(\$?)([\d,.]+)([KM%]?)$/); if (!m) return;
    const end = parseFloat(m[2].replace(/,/g, '')), dec = (m[2].split('.')[1] || '').length, t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 3), v = end * e;
      el.textContent = m[1] + (dec ? v.toFixed(dec) : Math.round(v).toLocaleString('en-US')) + m[3]; if (k < 1) requestAnimationFrame(step); else el.textContent = txt; };
    requestAnimationFrame(step);
  });
}
function show(i) {
  i = Math.floor(i / cols) * cols; cur = i;
  const nS = scrEls.length;
  scrEls.forEach((e, k) => {
    const rel = (k - i + nS) % nS, on = rel < cols, dest = (mode === 'mixed' && rel === 1) ? $('#stage2') : $('#stage');
    if (e.parentNode !== dest) dest.appendChild(e);
    if (on && !e.classList.contains('on')) countUps(e); e.classList.toggle('on', on); });
}
function mount() {
  const t = new Date(D.asOf), hrs = (Date.now() - t.getTime()) / 36e5;
  const lbl = t.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const asof = hrs > 36 ? `<span class="stale">Numbers are ${Math.floor(hrs / 24)} day${hrs >= 48 ? 's' : ''} old</span>` : 'Updated ' + lbl;
  $('#stage').innerHTML = screens.map((s, i) => `<section class="scr ${s.tag}"><div class="top"><span class="tag">${TAGS[s.tag]}</span><div class="ttl">${esc(s.t)}</div></div><div class="sub">${esc(s.sub || '')}</div><div class="body">${s.h}</div><div class="foot">${asof}</div></section>`).join('');
  scrEls = [...document.querySelectorAll('#stage .scr')];
  show(cur);
  if (timer) clearInterval(timer);
  timer = setInterval(() => show((cur + cols) % screens.length), ROTATE_SEC * 1000);
}

// ── live board (left): the board's own TV view, scaled to the box ────────────
let mode = 'side';
const BASE_SIDE = 1320, BASE_STACK = 1500, H_VIRT = 1000;
function fitBoard() {
  const wrap = $('.wrap'), box = $('#bframe'), f = $('#bf'), W = wrap.clientWidth, Hh = wrap.clientHeight;
  if (mode === 'side') {
    const w = box.clientWidth, h = box.clientHeight; if (!w || !h) return 0;
    const k = w / BASE_SIDE;
    f.style.width = BASE_SIDE + 'px'; f.style.height = Math.ceil(h / k) + 'px'; f.style.transform = 'scale(' + k + ')';
    return 0;
  }
  const base = mode === 'stack' ? BASE_STACK : BASE_SIDE, k = (mode === 'stack' ? W : box.clientWidth || W * 0.61) / base;
  const ok = board && Math.abs(board.W - base) < 3 && Math.abs(board.H - H_VIRT) < 3;
  const bandH = Math.min(Hh * 0.6, (ok ? board.need * k : Hh * 0.35) + Hh * 0.015);
  wrap.style.setProperty('--bh', bandH + 'px');
  f.style.width = base + 'px'; f.style.height = H_VIRT + 'px'; f.style.transform = 'scale(' + k + ')';
  return bandH;
}
// the board tells us how many shipments it is showing; the fewer there are, the more room the metrics get
function applyLayout() {
  const n = board ? board.n : 99;
  const want = n <= 2 ? 'stack' : n <= 4 ? 'mixed' : 'side';
  const was = mode; mode = want;
  const wrap = $('.wrap'); wrap.classList.toggle('stack', mode === 'stack'); wrap.classList.toggle('mixed', mode === 'mixed');
  const bandH = fitBoard(), Hh = wrap.clientHeight;
  const c = mode === 'stack' ? ((Hh - bandH) / Hh >= 0.5 ? 3 : 2) : mode === 'mixed' ? 2 : 1;
  if (c !== cols || was !== mode) { cols = c; $('#stage').style.setProperty('--cols', mode === 'mixed' ? 1 : cols); if (screens.length) { show(cur); if (timer) { clearInterval(timer); timer = setInterval(() => show((cur + cols) % screens.length), ROTATE_SEC * 1000); } } }
}
addEventListener('message', e => {
  const d = e.data; if (!d || !d.ctb) return;
  if (e.origin !== BOARD && !/^http:\/\/localhost(:\d+)?$/.test(e.origin)) return;
  board = d; applyLayout();
});
$('#bf').src = BOARD + '/?tv&bare';
addEventListener('resize', applyLayout);

async function loadData() {
  try { const r = await fetch(BOARD + '/api/dashboard', { cache: 'no-store' }); if (r.ok) { const d = await r.json(); if (d && d.ct) { try { localStorage.setItem('ctwall-data', JSON.stringify(d)); } catch (e) {} return d; } } } catch (e) {}
  try { const c = JSON.parse(localStorage.getItem('ctwall-data') || 'null'); if (c && c.ct) return c; } catch (e) {}
  try { const r = await fetch('seed.json', { cache: 'no-store' }); return await r.json(); } catch (e) { return null; }
}
let sig = '';
async function refresh() {
  const d = await loadData(); if (!d) return;
  const s = JSON.stringify(d); if (s === sig) return;
  sig = s; D = d; screens = buildScreens(); mount();
}
(async function () {
  applyLayout(); await refresh();
  setInterval(refresh, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { refresh(); applyLayout(); } });
})();
</script>
</body>
